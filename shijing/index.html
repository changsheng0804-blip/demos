</head>

    if(b.line){if(b.x>W+60||b.y<-60){b.x=-60-b.i*W*.035;b.y=S.hy*.9-b.i*H*.035}}
    else{if(b.x>W+60)b.x=-60;if(b.x<-60)b.x=W+60}
    const f=Math.sin(t*5+b.ph),s=b.s;ctx.strokeStyle=rgba(c,.85*a);ctx.lineWidth=Math.max(1,s*.2);ctx.beginPath();ctx.moveTo(b.x-s,b.y-f*s*.55);ctx.quadraticCurveTo(b.x-s*.4,b.y-s*.25,b.x,b.y);ctx.quadraticCurveTo(b.x+s*.4,b.y-s*.25,b.x+s,b.y-f*s*.55);ctx.stroke()}}
function drawParticles(t,dt,a){const wind=S.wind?45:8;
  for(const p of P){
    if(p.type==='snow'){p.y+=p.vy*dt;p.x+=(Math.sin(t*.8+p.ph)*12+wind)*dt;ctx.fillStyle=`rgba(253,251,246,${(.55+p.s*.4)*a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill()}
    else if(p.type==='rain'){p.y+=p.vy*dt;p.x+=(wind+50)*dt;ctx.strokeStyle=S.night?`rgba(200,206,220,${.3*a})`:`rgba(40,44,50,${.22*a})`;ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.len*.12,p.y-p.len);ctx.stroke()}
    else if(p.type==='petal'||p.type==='leaf'){p.y+=p.vy*dt;p.x+=(Math.sin(t*1.2+p.ph)*25+wind*1.4)*dt;p.rot+=p.vr*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.type==='petal'?`rgba(236,150,170,${.85*a})`:rgba(p.s<.4?[196,58,32]:p.s<.7?[218,120,40]:[160,40,30],.85*a);ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.55,0,0,TAU);ctx.fill();ctx.restore()}
    else if(p.type==='fly'){const mv=p.lamp?.12:1;p.x+=Math.cos(t*.7+p.ph)*22*dt*mv;p.y+=Math.sin(t*.9+p.ph*2)*14*dt*mv;if(p.lamp){ctx.fillStyle=`rgba(252,178,92,${.18*a})`;ctx.fillRect(p.x-.6,p.y+p.r*2,1.2,H*.03)}const gl=(.4+.6*Math.pow(Math.sin(t*2.5+p.ph),2))*a;const g2=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*6);const fc=S.lanterns?'252,178,92':'235,240,150';g2.addColorStop(0,`rgba(${fc},${gl})`);g2.addColorStop(1,`rgba(${fc},0)`);ctx.fillStyle=g2;ctx.fillRect(p.x-p.r*6,p.y-p.r*6,p.r*12,p.r*12)}
    if(p.y>H+30||p.x>W+40||p.x<-40){const np=spawn(p.type,false);if(p.type==='fly'){np.x=Math.random()*W}else if(Math.random()<.35){np.x=-30;np.y=Math.random()*H*.7}Object.assign(p,np)}}}
function drawText(t){
  const base=S.night?[236,226,204]:INK;
  for(let i=0;i<glyphs.length;i++){const gl=glyphs[i];const a=ease((t-gl.at)/.6);if(a<=0)continue;const on=i===activeG;const s=1+.22*(1-a)+(on?.07:0);
    ctx.save();ctx.translate(gl.x,gl.y);ctx.scale(s,s);ctx.font=gl.font;ctx.textAlign=gl.align;ctx.textBaseline=gl.align==='center'?'middle':'alphabetic';
    if(on){ctx.shadowColor='rgba(200,60,45,.7)';ctx.shadowBlur=gl.fs*.6;ctx.fillStyle=rgba(SEAL,.97*a)}else{if(!S.night){ctx.shadowColor='rgba(245,238,222,.9)';ctx.shadowBlur=gl.fs*.25}ctx.fillStyle=rgba(base,.92*a)}
    ctx.fillText(gl.ch,0,0);ctx.restore()}
  if(seal&&seal.at!=null){const a=ease((t-seal.at)/.4);if(a>0){const sc=1+.6*(1-a);ctx.globalAlpha=a;ctx.drawImage(seal.c,seal.x-seal.s*(sc-1)/2,seal.y-seal.s*(sc-1)/2,seal.s*sc,seal.s*sc);ctx.globalAlpha=1}}}
function drawBlooms(t){for(const b of blooms){const age=t-b.t;if(age<0)continue;const g=ease(age/.7);
  if(age<1.2){ctx.strokeStyle=rgba(b.c,.35*(1-age/1.2));ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(b.x,b.y,b.r*(1+age*3),0,TAU);ctx.stroke()}
  flower(ctx,b.x,b.y,b.r*g,b.c,1,b.rot+(1-g)*1.5)}}

/* ---------- main loop ---------- */
let last=0,lastLayer=5,typing=false,lastDraw=0;
function frame(now){
  if(typing&&now-lastDraw<66){requestAnimationFrame(frame);return}lastDraw=now;
  const t=(now-T0)/1000,dt=Math.min(.05,Math.max(0,(now-(last||now))/1000));last=now;
  if(gen)tick(t);
  for(const l of layers){if(l.merged||t<l.s||l.c)continue;const{c,g}=mk();l.fn(g);l.c=c}
  for(const l of layers){if(l.c&&!l.merged&&t>=l.s+FADE){(l.front?accF:accB).g.drawImage(l.c,0,0,W,H);l.c=null;l.merged=true}}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.lineCap='round';
  ctx.drawImage(accB.c,0,0,W,H);
  for(const l of layers)if(!l.front&&l.c&&!l.merged){ctx.globalAlpha=ease((t-l.s)/FADE);ctx.drawImage(l.c,0,0,W,H)}ctx.globalAlpha=1;
  const da=s=>ease((t-s)/2);
  drawShimmer(t,da(3.2));if(wf)drawFall(t,da(3.0));if(boat)drawBoat(t,da(3.6));drawMists(dt,da(2.4));
  ctx.drawImage(accF.c,0,0,W,H);
  for(const l of layers)if(l.front&&l.c&&!l.merged){ctx.globalAlpha=ease((t-l.s)/FADE);ctx.drawImage(l.c,0,0,W,H)}ctx.globalAlpha=1;
  drawBirds(t,dt,da(4.2));drawParticles(t,dt,da(lastLayer));
  drawText(t);drawBlooms(t);
  requestAnimationFrame(frame);
}
function paint(text){
  text=(text||'').trim().slice(0,64)||DEFAULT;
  accB=mk();accB.g.drawImage(paper,0,0,W,H);accF=mk();blooms.length=0;
  lastLayer=build(text);buildGlyphs(text);buildMusic(lastLayer);
  gen=scoreGen();pend=null;hl=[];T0=performance.now();
  try{history.replaceState(null,'','#'+encodeURIComponent(text))}catch(e){}
  input.value=text;
}
function setup(){W=innerWidth;H=innerHeight;DPR=Math.min(window.devicePixelRatio||1,2,Math.sqrt(4.5e6/(W*H)));cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);makePaper()}

/* ---------- ui ---------- */
const input=document.getElementById('poem');
input.addEventListener('focus',()=>{typing=true});input.addEventListener('blur',()=>{typing=false});
const chips=document.getElementById('chips');
CHIPS.forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=c.split(/[，,]/)[0];b.onclick=()=>{initAudio();paint(c)};chips.appendChild(b)});
document.getElementById('go').onclick=()=>{initAudio();paint(input.value);input.blur()};
input.addEventListener('keydown',e=>{if(e.key==='Enter'){initAudio();paint(input.value);input.blur()}});
const toast=m=>{const el=document.getElementById('toast');el.textContent=m;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,1800)};
document.getElementById('snd').onclick=e=>{initAudio();soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔈';toast(soundOn?'琴声已开':'琴声已关')};
document.getElementById('save').onclick=()=>{cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`诗境-${curText.slice(0,10)}.png`;document.body.appendChild(a);a.click();a.remove();toast('画作已保存')},'image/png')};
document.getElementById('share').onclick=()=>{const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('链接已复制，发给朋友，他们会看到同一幅画')).catch(()=>prompt('复制这个链接：',u))};
document.getElementById('clean').onclick=()=>document.body.classList.toggle('clean');
addEventListener('keydown',e=>{if(e.target===input)return;if(e.key==='h'||e.key==='H')document.body.classList.toggle('clean')});
let down=false,lp=null;
function bloomAt(x,y){const t=(performance.now()-T0)/1000;const c=(S.snow||Math.random()<.5)?[192,38,46]:[232,128,152];blooms.push({x,y,t,r:(7+Math.random()*6)*(Math.min(W,H)/800+.5),rot:Math.random()*TAU,c});if(blooms.length>400)blooms.shift();
  if(AC&&soundOn&&scale.length){const i=clamp(Math.round((1-y/H)*14),0,14);pluck(scale[i],AC.currentTime+.005,.36,Math.random()<.25?1:0,(x/W-.5)*.8)}}
cv.addEventListener('pointerdown',e=>{initAudio();down=true;lp=[e.clientX,e.clientY];bloomAt(e.clientX,e.clientY)});
cv.addEventListener('pointermove',e=>{if(!down)return;if(Math.hypot(e.clientX-lp[0],e.clientY-lp[1])>30){lp=[e.clientX,e.clientY];bloomAt(e.clientX,e.clientY)}});
addEventListener('pointerup',()=>down=false);addEventListener('pointercancel',()=>down=false);
const introEl=document.getElementById('intro');
introEl.addEventListener('click',()=>{initAudio();introEl.style.opacity=0;setTimeout(()=>introEl.remove(),1200);paint(curText)});
let lastW=0;addEventListener('resize',()=>{clearTimeout(setup.t);setup.t=setTimeout(()=>{if(Math.abs(innerWidth-lastW)<2&&Math.abs(innerHeight-H)<H*.3)return;lastW=innerWidth;setup();paint(curText)},250)});
setup();lastW=W;
let start=DEFAULT;try{const h=decodeURIComponent(location.hash.slice(1));if(h)start=h}catch(e){}
paint(start);
if(document.fonts&&document.fonts.load)document.fonts.load(`40px 'Ma Shan Zheng'`).then(()=>{if(seal)seal.c=makeSeal(seal.s)}).catch(()=>{});
if(/[?&]skip/.test(location.search)){introEl.remove()}
requestAnimationFrame(frame);
window.__paint=paint;window.__find=findScene;window.__SC=SCENES;window.__S=()=>S;
})();
</script>
