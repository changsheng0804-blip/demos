<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>毛利元就 西国势力沙盘</title>
    <link rel="stylesheet" href="hark.css" />
    <link rel="stylesheet" href="hark-hero.css" />
    <style>
      .x-app{--paper:#f3ede1;--ink:#2b2622;--accent:#b0402c;--gold:#b8892b;--serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
        position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 10px clamp(220px,var(--x-pw,300px),45vw);grid-template-rows:minmax(0,1fr) auto;background:var(--paper);color:var(--ink);
        font-family:var(--sans),"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;z-index:1}
      .x-map{position:relative;min-height:0;border-right:1px solid rgba(43,38,34,.18);overflow:hidden}
      .x-map>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
      .x-title{position:absolute;top:14px;left:18px;margin:0;font:900 22px/1.3 var(--serif);letter-spacing:.04em;pointer-events:none;text-shadow:0 0 4px var(--paper),0 0 8px var(--paper)}
      .x-terrain{pointer-events:none}
      #regions{mix-blend-mode:multiply}
      .x-reg{transition:fill 1.2s ease,fill-opacity .3s ease;fill-opacity:.5;stroke:var(--ink);stroke-opacity:.55;stroke-width:.7px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
      .x-reg.is-minor{fill-opacity:.35}
      .x-reg:hover{fill-opacity:.7}
      .x-reg.is-district{stroke-width:.45px;stroke-dasharray:3 2;stroke-opacity:.6}
      .x-still .x-reg{transition:none}
      .x-aki{fill:none;stroke:var(--ink);stroke-width:1.4px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
      .x-map text{paint-order:stroke;stroke:var(--paper);stroke-linejoin:round;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
      .x-lb-p{font:600 13px var(--serif);stroke-width:3px}
      .x-lb-d{font:500 8.5px var(--sans),sans-serif;stroke-width:2.8px;fill-opacity:.9}
      .x-lb-pl{font:500 8px var(--sans),sans-serif;stroke-width:2.6px;text-anchor:start!important}
      .x-lb-sea{font:600 15px var(--serif);letter-spacing:.3em;stroke-width:3px;fill:#6f8399!important;fill-opacity:.8}
      .x-castle{fill:var(--paper);stroke:var(--ink);stroke-width:1.1px}
      .x-place{fill:var(--ink)}
      .x-pulse{fill:#fff;stroke:#fff;stroke-width:4px;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 6px #fff);opacity:0;animation:xpulse .8s ease-out forwards;pointer-events:none}
      @keyframes xpulse{35%{opacity:.85}100%{opacity:0}}
      .x-float{font:900 16px var(--serif)!important;stroke-width:3.5px!important;opacity:0;animation:xfloat 2s ease-out forwards}
      @keyframes xfloat{0%{opacity:0;transform:translateY(4px)}20%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
      .x-focus circle{fill:none;stroke:var(--accent);stroke-width:2px;vector-effect:non-scaling-stroke}
      .x-focus .x-core{fill:var(--accent);stroke:var(--paper)}
      .x-legend{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:3px;padding:8px 10px;background:rgba(243,237,225,.88);border:1px solid rgba(43,38,34,.2);border-radius:var(--r-s);font:var(--type-caption);max-height:60%;overflow:auto}
      .x-legend span{display:flex;align-items:center;gap:6px}
      .x-sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(43,38,34,.4);flex:none;vertical-align:-2px}
      .x-note-dlg{width:min(420px,calc(100% - 32px))}
      .x-overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 30px;min-height:var(--tap);border:0;border-radius:var(--r-pill);background:var(--accent);color:#fff;font:900 22px var(--serif);letter-spacing:.1em;cursor:pointer;box-shadow:0 10px 30px rgba(43,38,34,.3)}
      .x-overlay[hidden]{display:none}
      .x-panel{min-height:0;overflow-y:auto;padding:20px 22px 24px;display:flex;flex-direction:column;gap:18px}
      .x-year{margin:0;font:900 64px/1 var(--serif);color:var(--accent);letter-spacing:.02em}
      .x-ftitle{margin:6px 0 2px;font:900 22px/1.35 var(--serif)}
      .x-age{margin:0;font:var(--type-label);color:#574f47}
      .x-desc{margin:8px 0 0;font:var(--type-body);line-height:1.7}
      .x-h{margin:0 0 8px;font:600 13px var(--serif);letter-spacing:.08em;color:rgba(43,38,34,.75);border-bottom:1px solid rgba(43,38,34,.15);padding-bottom:4px}
      .x-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
      .x-chips li{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid rgba(43,38,34,.25);border-radius:var(--r-pill);font:var(--type-caption);background:rgba(255,255,255,.35)}
      .x-chips b{font-weight:600}
      .x-none{font:var(--type-caption);color:#574f47;margin:0}
      .x-race{position:relative;height:128px}
      .x-row{position:absolute;left:0;right:0;height:26px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;transition:top .8s ease;font:var(--type-label)}
      .x-track{height:14px;border-radius:4px;background:rgba(43,38,34,.07);overflow:hidden}
      .x-fill{height:100%;border-radius:4px;transition:width 1s ease}
      .x-val{font-family:"Geist Mono",monospace;text-align:right}
      .x-cap{margin:4px 0 0;font:var(--type-caption);color:#574f47}
      .x-people{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
      .x-people li{position:relative;display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid rgba(43,38,34,.18);border-radius:var(--r-s);background:rgba(255,255,255,.4)}
      .x-av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:900 15px var(--serif);color:var(--ink);border:1px solid rgba(43,38,34,.35)}
      .x-people b{display:block;font:600 13px/1.3 var(--serif)}
      .x-people small{display:block;font:var(--type-caption);color:#574f47}
      .x-people em{position:absolute;top:-8px;right:6px;font:600 11px/1 var(--sans);font-style:normal;padding:3px 6px;border-radius:var(--r-pill);background:#8a6418;color:#fff}
      .x-people .is-died{filter:grayscale(1);opacity:.65}
      .x-links{margin:0;font:var(--type-label);display:flex;align-items:center;flex-wrap:wrap;gap:6px}
      .x-links i{font-style:normal;color:var(--accent);font-weight:600}
      .x-bar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:10px 22px 12px;border-top:1px solid rgba(43,38,34,.18);background:#ece4d4}
      .x-ctrl{display:flex;gap:6px;align-items:center;flex:none}
      .x-ctrl button{min-width:var(--tap);min-height:var(--tap);border:1px solid rgba(43,38,34,.3);border-radius:var(--r-s);background:var(--paper);color:var(--ink);font:600 14px var(--sans);cursor:pointer;padding:0 10px}
      .x-ctrl button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
      .x-ctrl button:disabled{opacity:.4;cursor:default}
      .x-ctrl .x-play{background:var(--accent);color:#fff;border-color:var(--accent);min-width:52px}
      .x-tl{position:relative;flex:1;height:52px;margin:0 12px}
      .x-axis{position:absolute;left:0;right:0;top:20px;height:4px;border-radius:2px;background:rgba(43,38,34,.15)}
      .x-prog{position:absolute;left:0;top:20px;height:4px;border-radius:2px;background:var(--accent);transition:width .6s ease}
      .x-tl{cursor:pointer;touch-action:pan-y}
      .x-yt{position:absolute;top:16px;width:1px;height:4px;margin-left:-.5px;background:rgba(43,38,34,.35);pointer-events:none}
      .x-yt.is-dec{top:13px;height:7px;background:rgba(43,38,34,.6)}
      .x-node{position:absolute;top:22px;width:var(--tap);height:var(--tap);margin:-22px 0 0 -22px;border:0;background:none;cursor:pointer;padding:0;pointer-events:none}
      .x-node::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);box-sizing:border-box;transition:transform .3s,background .3s}
      .x-node.is-past::after{background:var(--accent);border-color:var(--accent)}
      .x-node.is-hov::after{transform:scale(1.4)}
      .x-node.is-on::after{background:var(--accent);border-color:var(--accent);transform:scale(1.6);box-shadow:0 0 0 3px rgba(176,64,44,.25)}
      .x-node:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
      .x-nl{position:absolute;left:50%;top:32px;transform:translateX(-50%);padding:0 3px;border-radius:4px;background:#ece4d4;font:600 12px "Geist Mono",monospace;color:var(--ink);opacity:0;transition:opacity .2s;pointer-events:none;z-index:2}
      .x-node.is-hov .x-nl,.x-node:focus-visible .x-nl{opacity:1}
      .x-node.is-on .x-nl{opacity:0}
      .x-tick{position:absolute;top:34px;transform:translateX(-50%);font:12px "Geist Mono",monospace;color:#574f47;pointer-events:none}
      .x-cur{position:absolute;top:-12px;transform:translateX(-50%);font:900 18px/1 var(--serif);color:var(--accent);transition:left .6s ease;pointer-events:none;text-shadow:0 0 4px #ece4d4}
      .x-claim{fill:none;stroke-width:3px;stroke-dasharray:8 5;stroke-linejoin:round;pointer-events:none}
      .x-map .x-rib{font:900 14px var(--serif);stroke:none;fill:#fff;letter-spacing:.06em}
      .x-map .x-fxl{font:600 12px var(--serif);stroke-width:3.5px}
      .x-map .x-fxb{font:900 12px var(--serif);stroke-width:3.5px}
      .x-map .x-badge{font:900 10px var(--serif);stroke:none;fill:var(--paper)}
      .x-no-ar .x-ar,.x-no-bt .x-bt,.x-no-di .x-lb-d,.x-no-pe #peopleBox{display:none}
      .x-no-di .x-reg.is-district{stroke-opacity:0}
      .x-ly{flex-wrap:wrap}
      .x-spark{display:block;width:100%;height:56px;margin-top:6px;border-bottom:1px solid rgba(43,38,34,.2)}
      .x-spark polyline{fill:none;stroke-width:1.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
      .x-sy{display:flex;justify-content:space-between;font:12px "Geist Mono",monospace;color:#574f47}
      /* concise mode */
      .x-app:not(.x-concise) .x-c{display:none!important}
      .x-concise .x-d{display:none!important}
      .x-more[hidden],.x-tg[hidden],.x-none[hidden]{display:none!important}
      .x-concise .x-reg{transition:fill 1.2s ease,opacity .6s ease,filter .6s ease}
      .x-concise .x-still .x-reg{transition:none}
      .x-concise .x-reg.is-district{stroke-width:.35px;stroke-opacity:.4}
      .x-dim .x-reg:not(.is-chg){opacity:.85;filter:saturate(.5)}
      .x-concise .x-lb-sea{opacity:.4}
      .x-concise .x-fxl,.x-concise .x-fxb{display:none}
      .x-concise .x-lb-p,.x-concise .x-lb-d,.x-concise .x-lb-pl{transition:opacity .4s ease}
      .x-concise .x-lb-p:not(.is-on):not(.is-hov),.x-concise .x-lb-d:not(.is-on):not(.is-hov),.x-concise .x-lb-pl:not(.is-on){opacity:0}
      .x-aki-lb,.x-dotm{display:none}
      .x-dotm{fill:var(--ink);fill-opacity:.55}
      .x-concise .x-aki-lb{display:inline}
      .x-concise .x-pl:not(.is-on) .x-mk{display:none}
      .x-concise .x-pl:not(.is-on) .x-dotm{display:inline}
      .x-concise .x-ar>g,.x-concise .x-bt>g{transition:opacity .4s ease}
      .x-concise .x-legend{top:14px;right:14px;left:auto;bottom:auto}
      .x-sub{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:max-content;max-width:86%;margin:0;padding:8px 18px;border-radius:var(--r-s);background:rgba(43,38,34,.82);color:#fff;font:600 18px/1.4 var(--serif);text-align:center;pointer-events:none;opacity:0;transition:opacity .35s ease}
      .x-sub.is-on{opacity:1}
      .x-aff{display:inline-flex;align-items:center;gap:6px;margin:4px 6px 2px 0;padding:4px 12px;border:1px solid rgba(43,38,34,.25);border-radius:var(--r-pill);font:var(--type-caption);background:rgba(255,255,255,.4)}
      #aff{margin:6px 0 4px}
      .x-more{display:inline-flex;align-items:center;min-height:var(--tap);margin:-12px 0;padding:0 6px;border:0;background:none;color:var(--accent);font:600 13px var(--sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
      .x-tg{min-height:var(--tap);margin-top:8px;padding:0 14px;border:1px solid rgba(43,38,34,.3);border-radius:var(--r-pill);background:transparent;color:var(--ink);font:600 12px var(--sans);cursor:pointer}
      .x-tg[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
      .x-chips .x-plus{padding:0}
      .x-plus button{min-height:var(--tap);margin:-10px 0;padding:0 12px;border:0;background:none;color:var(--ink);font:600 12px var(--sans);cursor:pointer}
      .x-people em.is-out{background:#6f665b}
      .x-concise:not(.x-trend) #spark,.x-concise:not(.x-trend) .x-sy{display:none}
      .x-tip{position:fixed;z-index:30;max-width:280px;padding:8px 10px;border:1px solid rgba(43,38,34,.25);border-radius:var(--r-s);background:var(--paper);color:var(--ink);box-shadow:0 6px 20px rgba(43,38,34,.2);font:var(--type-caption);line-height:1.5;pointer-events:none}
      .x-tip[hidden]{display:none}
      .x-tip b{display:block;font:600 13px/1.4 var(--serif)}
      .x-tip-f{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:2px}
      .x-tip-n{display:block;margin-top:4px;color:#574f47}
      .x-chips li[data-r]{cursor:help;text-decoration:underline dotted rgba(43,38,34,.45);text-underline-offset:3px}
      .x-chips li[data-r]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
      .x-lgx{min-height:var(--tap);margin:-14px 0 -14px auto;padding:0 2px 0 8px;border:0;background:none;color:var(--accent);font:600 12px var(--sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
      .x-lgm{display:flex;flex-direction:column;gap:3px;padding-left:18px}
      .x-dlg{width:min(560px,calc(100% - 32px));max-height:80vh;padding:20px 22px 22px;border:1px solid rgba(43,38,34,.25);border-radius:var(--r-m);background:var(--paper);color:var(--ink);box-shadow:0 20px 50px rgba(43,38,34,.3);font:var(--type-body);line-height:1.7}
      .x-dlg::backdrop{background:rgba(43,38,34,.45)}
      .x-dlg-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
      .x-dlg h2{margin:0;font:900 20px/1.3 var(--serif)}
      .x-dlg-x{min-width:var(--tap);min-height:var(--tap);border:1px solid rgba(43,38,34,.3);border-radius:var(--r-s);background:transparent;color:var(--ink);font:600 16px var(--sans);cursor:pointer}
      .x-dlg section+section{margin-top:16px}
      .x-dlg ul{margin:0;padding-left:20px}
      .x-dlg li+li{margin-top:4px}
      .x-dlg p{margin:0 0 6px}
      .x-dlg .x-src{font:var(--type-caption);color:#574f47}
      /* reliability layer */
      .x-reg.is-spec{fill-opacity:.75}
      .x-reg.is-spec:hover{fill-opacity:.85}
      .x-cfo{fill:none;stroke:var(--ink);vector-effect:non-scaling-stroke;pointer-events:none}
      .x-cfo.is-spec{stroke-width:2.4px;stroke-dasharray:1 3;stroke-linecap:round;stroke-opacity:.4}
      .x-conf .x-cfo.is-spec{stroke-opacity:.7}
      .x-cfo.is-sure{stroke-width:2px;stroke-opacity:.75;display:none}
      .x-conf .x-cfo.is-sure{display:inline}
      .x-cfb{pointer-events:none}
      .x-cfb circle{fill:var(--paper);stroke:var(--ink);stroke-opacity:.5;stroke-width:.8px;vector-effect:non-scaling-stroke}
      .x-map .x-cfb text{font:600 9px var(--sans),sans-serif;stroke:none}
      .x-cfb.is-sure{display:none}
      .x-conf .x-cfb.is-sure{display:inline}
      .x-cfl{display:flex;flex-direction:column;gap:3px;margin-top:4px;padding-top:5px;border-top:1px solid rgba(43,38,34,.15);max-width:240px}
      .x-cfl span{align-items:flex-start!important;line-height:1.4}
      .x-cfl b{font-weight:600;flex:none}
      .x-cfi{flex:none;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--paper);border:1px solid rgba(43,38,34,.5);font:600 12px/1 var(--sans);font-style:normal;color:var(--ink)}
      .x-cfi.is-none{border-color:transparent;background:none}
      .x-gd{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;vertical-align:0}
      .x-tip-c{display:block;margin-top:4px}
      .x-gp{display:inline-flex;align-items:center;min-height:var(--tap);min-width:var(--tap);margin:-10px 0 -10px 4px;padding:0 4px;vertical-align:middle;cursor:help}
      .x-gp[hidden]{display:none}
      .x-gpi{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border:1px solid currentColor;border-radius:var(--r-pill);font:600 12px/1.5 var(--sans)}
      .x-gp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
      .x-dlg dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
      .x-dlg dt{display:flex;align-items:center;gap:6px;font-weight:600}
      .x-dlg dd{margin:0}
      /* economic layer */
      .x-app:not(.x-eco) .x-eco-only{display:none}
      .x-eco-n.is-hl{display:inline!important}
      .x-eco-n{cursor:help}
      .x-eco-n .x-ring{fill:var(--paper);stroke-width:2px;vector-effect:non-scaling-stroke;transition:stroke .8s ease}
      .x-ic{fill:none;stroke:var(--ink);stroke-width:1.1px;stroke-linecap:round;stroke-linejoin:round}
      .x-ic .x-ag{fill:#9aa3ad;stroke:#5d646c;stroke-width:.8px}
      .x-map .x-eco-lb{font:600 8px var(--sans),sans-serif;stroke-width:2.4px}
      .x-map .x-eco-zl{font:600 9px var(--serif);stroke-width:2.6px;fill:#4f6f8f}
      .x-map .x-eco-tl{font:500 8.5px var(--sans),sans-serif;stroke-width:2.4px;fill:#574f47;text-anchor:start}
      .x-eco-hit{fill:none;stroke:transparent;stroke-width:10px;pointer-events:stroke;cursor:help}
      .x-boat{cursor:help}
      .x-ev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font:var(--type-caption);line-height:1.5}
      .x-ev b{font:600 12px "Geist Mono",monospace;margin-right:6px}
      .x-coin{position:relative;display:inline-block;width:.85em;height:.85em;margin-right:.4em;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 1.5px #8a6418;vertical-align:-.06em}
      .x-coin::after{content:"";position:absolute;left:50%;top:50%;width:.26em;height:.26em;margin:-.13em;background:rgba(43,38,34,.82)}
      .x-ecl svg{flex:none;width:16px;height:16px;overflow:visible}
      .x-ecl svg.x-lr{width:24px;height:10px}
      /* relation beat (concise mode) */
      .x-rp{fill:none;stroke-linejoin:round}
      .x-rline.is-spec .x-rp{stroke-opacity:.38}
      .x-rhit{fill:none;stroke:transparent;stroke-width:9px;pointer-events:stroke;cursor:help}
      .x-rn{pointer-events:none}
      .x-rnd{stroke:var(--paper);stroke-width:1.4px}
      .x-rtab{fill:var(--paper);stroke:var(--ink);stroke-opacity:.5;stroke-width:1px}
      .x-map .x-rnl{font:600 9px var(--serif);stroke-width:2.6px}
      .x-map .x-rq{font:900 11px var(--serif);stroke-width:3px}
      .x-map .x-rx{font:900 9px var(--sans),sans-serif;stroke-width:2.6px}
      .x-focus,#ribbon,#confBadges{pointer-events:none}
      .x-rld{stroke:var(--ink);stroke-opacity:.55;stroke-width:.8px;vector-effect:non-scaling-stroke}
      .x-lyb{display:none}
      @media (max-width:820px){.x-app{position:static;display:flex;flex-direction:column}.x-map{height:62vh;border-right:0}.x-bar{flex-wrap:wrap;position:sticky;bottom:0}.x-tl{flex-basis:100%;margin:0 10px}.x-bar .x-ctrl{flex:1 1 auto;flex-wrap:wrap;max-width:100%}.x-title{font-size:17px}.x-sub{font-size:15px;bottom:60px}}
      @media (max-width:480px){
        .x-bar{padding:8px 10px 10px;gap:8px 10px}
        .x-bar .x-ctrl{flex:0 1 auto}
        .x-bar .x-ctrl:first-child{flex:1 1 100%;flex-wrap:nowrap}
        .x-lyw{position:relative}
        .x-lyb{display:inline-flex;align-items:center}

              const bx = px + (j - (n - 1) / 2) * 160, by = Y2 + 6, nm = hName(l.house), w = nm.length * 13 + 30;
              const g = mark(sel("g", { class: "x-fh" }, gH), "h:" + p + l.house);
              const L = Math.hypot(bx - px, by - py), ux = (bx - px) / L, uy = (by - py) / L, tx = bx - ux * 7, ty = by - uy * 7;
              sel("line", { x1: px, y1: py + 2, x2: tx, y2: ty, class: "x-fh-a" }, g);
              sel("path", { d: `M${bx},${by}L${tx - uy * 5},${ty + ux * 5}L${tx + uy * 5},${ty - ux * 5}Z`, class: "x-fh-h" }, g);
              const mx = (px + bx) / 2, mY = (py + by) / 2, left = bx <= px;
              stxt(g, mx + (left ? -8 : 8), mY, "x-fh-l", `${l.year} ${l.label}`, { "text-anchor": left ? "end" : "start" });
              const b = sel("g", { class: "x-fh-b" }, g);
              sel("rect", { x: bx - w / 2, y: by, width: w, height: 30, rx: 15 }, b);
              const fc = (FA[HS[l.house] && HS[l.house].faction] || FA.OTHER || {}).color || GREY;
              sel("rect", { x: bx - w / 2 + 12, y: by + 8, width: 5, height: 14, rx: 2, fill: fc, stroke: "none" }, b);
              stxt(b, bx + 4, by + 15.5, "", nm);
            });
          });
          // people
          FAM.nodes.forEach((n) => {
            if (!vis.has(n.id)) return;
            const [x, top] = POS[n.id], d = dead[n.id], isDead = d && d <= y;
            const cls = "x-fn is-" + n.kind + (gold.has(n.id) ? " is-gold" : "") + (isDead ? " is-dead" : "");
            const g = mark(sel("g", { class: cls, tabindex: 0, role: "img", "aria-label": `${n.name}${n.house ? "，出身" + hName(n.house) : ""}${isDead ? "，†" + d : ""}${n.note ? "。" + n.note : ""}` }, gN), "n:" + n.id);
            sel("rect", { x: x - BW / 2, y: top, width: BW, height: BH, rx: 10, class: "x-fn-box" }, g);
            const two = n.house || isDead;
            stxt(g, x, top + (two ? 17 : BH / 2 + 1), "x-fn-nm", short(n.name));
            if (two) {
              const parts = [];
              if (n.house) { const hn = hName(n.house); parts.push({ w: hn.length * 11 + 12, hn }); }
              if (isDead) parts.push({ w: 42, d });
              let cx = x - (parts.reduce((s, p) => s + p.w, 0) + (parts.length - 1) * 4) / 2;
              parts.forEach((p) => {
                if (p.hn) {
                  const fc = (FA[HS[n.house] && HS[n.house].faction] || FA.OTHER || {}).color || GREY, tg = sel("g", { class: "x-fn-tag" }, g);
                  sel("rect", { x: cx, y: top + 28, width: p.w, height: 15, rx: 7.5, fill: fc }, tg);
                  stxt(tg, cx + p.w / 2, top + 36, "x-fn-tg", p.hn);
                } else stxt(g, cx + p.w / 2, top + 36, "x-fn-d", "†" + p.d);
                cx += p.w + 4;
              });
            }
            g.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") famTip(n, e); });
            g.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse" && tip.dataset.fam === n.id) famTip(n, e); });
            g.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") famTipOff(); });
            g.addEventListener("click", (e) => { e.stopPropagation(); if (tip.dataset.fam === n.id) famTipOff(); else famTip(n, e); });
            g.addEventListener("focus", (e) => famTip(n, e, true));
            g.addEventListener("blur", famTipOff);
          });
          $("fvYr").textContent = y ? `${y}年 · 家族` : "家族";
          fsvg.setAttribute("aria-label", `${y}年 毛利家族图：` + FAM.nodes.filter((n) => vis.has(n.id)).map((n) => short(n.name)).join("、"));
          famShown = keys;
        }
        $("fvNote").textContent = FAM.note || "";

        function setView(v) {
          on = v === "camp"; famOn = v === "fam";
          map.classList.toggle("x-camp-on", on);
          map.classList.toggle("x-fam-on", famOn);
          cv.setAttribute("aria-hidden", !on);
          fv.setAttribute("aria-hidden", !famOn);
          $("map").setAttribute("aria-hidden", v !== "map");
          $("vMap").setAttribute("aria-pressed", v === "map");
          $("vCamp").setAttribute("aria-pressed", on);
          $("vFam").setAttribute("aria-pressed", famOn);
          if (!famOn) famTipOff();
          if (on && shown !== cur) draw(cur, false);
          if (famOn) famDraw(cur, false);
        }
        $("vMap").onclick = () => setView("map");
        $("vCamp").onclick = () => setView("camp");
        $("vFam").onclick = () => setView("fam");
        window.addEventListener("x-frame", (e) => {
          cur = e.detail;
          if (on) draw(cur, true);
          if (famOn) famDraw(cur, true);
        });
        window.addEventListener("x-frame-still", (e) => {
          cur = e.detail;
          if (on) draw(cur, false);
          if (famOn) famDraw(cur, false);
        });
        draw(0, false);
      })();
    </script>
  </body>
</html>
