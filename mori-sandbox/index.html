<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>毛利元就 西国势力沙盘</title>
    <link rel="stylesheet" href="vendor/hark.css" />
    <link rel="stylesheet" href="vendor/hark-hero.css" />
    <link rel="stylesheet" href="css/sandbox.css" />
  </head>
  <body>
    <div class="page" id="top">
      <div class="x-app x-concise" id="app">
        <div class="x-map">
          <svg id="map" class="x-still" role="img" aria-label="西国势力地图" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="x-cv" id="campView" aria-hidden="true">
            <p class="x-cv-yr" id="cvYr"></p>
            <div class="x-cv-rels" id="cvRels"></div>
            <div class="x-cv-cols" id="cvCols"></div>
            <p class="x-cv-mv" id="cvMv" aria-live="polite"></p>
          </div>
          <div class="x-cv" id="familyView" aria-hidden="true">
            <p class="x-cv-yr" id="fvYr"></p>
            <div class="x-fv-box"><svg class="x-fv-svg" id="fvSvg" role="group" aria-label="毛利家族图" preserveAspectRatio="xMidYMin meet"></svg></div>
            <p class="x-fv-note" id="fvNote"></p>
          </div>
          <div class="x-tools">
          <div class="x-seg" role="group" aria-label="视图">
            <button type="button" id="vMap" aria-pressed="true">地图</button><button type="button" id="vCamp" aria-pressed="false">阵营</button><button type="button" id="vFam" aria-pressed="false">家族</button>
          </div>
          <button type="button" class="x-maxb" id="maxBtn" aria-pressed="false" aria-label="地图最大化" title="地图最大化（F）"><span aria-hidden="true">⤢</span></button>
          </div>
          <button type="button" class="x-restore" id="maxOff" title="还原布局（Esc 或 F）">还原</button>
          <h1 class="x-title" id="mtitle"></h1>
          <p class="x-sub" id="sub" aria-live="polite"></p>
          <div class="x-legend" id="legend"></div>
          <div class="x-zm" role="group" aria-label="地图缩放">
            <button type="button" id="zIn" aria-label="放大" title="放大">＋</button><button type="button" id="zOut" aria-label="缩小" title="缩小">－</button><button type="button" id="zRe" aria-label="重置视图" title="重置视图并恢复自动镜头">⟲</button>
          </div>
          <button class="x-overlay" id="overlay" type="button">▶ 播放</button>
          <p class="x-rec-yr" id="recYr" aria-hidden="true"></p>
          <div class="x-rec-lg" id="recLg" aria-hidden="true"></div>
          <p class="x-rec-end" id="recEnd">录制结束 · 按 Esc 退出</p>
        </div>
        <div class="x-grip" id="grip" role="separator" aria-orientation="vertical" aria-label="调整说明面板宽度" aria-valuemin="220" aria-valuenow="300" tabindex="0" title="拖动调整面板宽度"></div>
        <aside class="x-panel" aria-live="polite">
          <div>
            <p class="x-year" id="yr"></p>
            <h2 class="x-ftitle"><span id="ft"></span><span class="x-gp" id="eg" tabindex="0" role="button"></span></h2>
            <p class="x-c" id="aff"></p>
            <p class="x-age" id="age"></p>
            <p class="x-desc"><span id="desc"></span> <button class="x-more x-c" id="descTg" type="button" aria-expanded="false">展开</button></p>
          </div>
          <div><h3 class="x-h">本年变化</h3><div id="changes"></div></div>
          <div class="x-eco-only" id="econBox"><h3 class="x-h">经济要闻</h3><ul class="x-ev" id="econEv"></ul></div>
          <div>
            <h3 class="x-h">势力消长</h3>
            <div class="x-race" id="race"></div>
            <svg class="x-spark" id="spark" viewBox="0 0 480 95" preserveAspectRatio="none" role="img" aria-label="四大势力领国数走势，1523至今"></svg>
            <div class="x-sy"><span id="sy0"></span><span id="sy1"></span></div>
            <p class="x-cap">主导领国数（争夺各计0.5，安艺每郡1/8）</p>
            <button class="x-tg x-c" id="trendTg" type="button" aria-pressed="false">趋势</button>
          </div>
          <div id="peopleBox">
            <h3 class="x-h">人物</h3>
            <ul class="x-people" id="people"></ul>
            <p class="x-none x-c" id="pnone">本年无人物登场或退场</p>
            <button class="x-tg x-c" id="peopleTg" type="button" aria-pressed="false">全部人物</button>
          </div>
          <div class="x-d"><h3 class="x-h">从属关系</h3><p class="x-links" id="links"></p></div>
        </aside>
        <div class="x-bar">
          <div class="x-ctrl">
            <button class="x-play" id="play" type="button" aria-label="播放">▶</button>
            <button id="prev" type="button" aria-label="上一年">◀</button>
            <button id="next" type="button" aria-label="下一年">▶</button>
            <span style="width:8px"></span>
            <button type="button" data-sp="0.5" aria-pressed="false">0.5x</button>
            <button type="button" data-sp="1" aria-pressed="true">1x</button>
            <button type="button" data-sp="2" aria-pressed="false">2x</button>
            <button type="button" id="recBtn" aria-haspopup="dialog">录屏</button>
          </div>
          <div class="x-ctrl x-lyw" id="lyw">
          <button type="button" class="x-lyb" id="lyBtn" aria-expanded="false" aria-controls="lyPop">图层 ▾</button>
          <div class="x-ctrl x-ly" id="lyPop" role="group" aria-label="图层">
            <button type="button" data-ly="ar" aria-pressed="true">箭头</button>
            <button type="button" data-ly="bt" aria-pressed="true">战役</button>
            <button type="button" data-ly="di" aria-pressed="true">郡界</button>
            <button type="button" data-ly="pe" aria-pressed="true">人物</button>
            <button type="button" data-ly="ca" aria-pressed="true">城池</button>
            <button type="button" id="confBtn" aria-pressed="false">可信度</button>
            <button type="button" id="ecoBtn" aria-pressed="false">经济</button>
          </div>
          </div>
          <div class="x-ctrl" role="group" aria-label="模式">
            <button type="button" data-mode="c" aria-pressed="true">简洁</button>
            <button type="button" data-mode="d" aria-pressed="false">详细</button>
          </div>
          <div class="x-ctrl">
            <button type="button" id="srcBtn" aria-haspopup="dialog">史料说明</button>
            <button type="button" id="noteBtn" aria-haspopup="dialog" aria-label="示意说明" title="示意说明">ⓘ</button>
          </div>
          <div class="x-tl" id="tl"><div class="x-axis"></div><div class="x-prog" id="prog"></div><span class="x-cur" id="cur"></span></div>
        </div>
        <div class="x-tip" id="tip" role="tooltip" hidden></div>
        <dialog class="x-dlg" id="srcDlg" aria-labelledby="srcH">
          <div class="x-dlg-hd"><h2 id="srcH">史料说明</h2><button class="x-dlg-x" id="srcX" type="button" aria-label="关闭">✕</button></div>
          <section><h3 class="x-h">可信度分级</h3><dl id="gradeList"></dl></section>
          <section><h3 class="x-h">本次校对</h3><ul id="corr"></ul></section>
          <section>
            <h3 class="x-h">说明</h3>
            <p id="srcNote"></p>
            <p>势力归属以通说为准，按国或郡概括表示；军记中的兵力数字与部分年份存在异说。</p>
            <p>关系线的年份多为通说，联姻年份尤其多有异说。</p>
            <p class="x-src" id="srcSrc"></p>
          </section>
        </dialog>
        <dialog class="x-dlg x-note-dlg" id="noteDlg" aria-labelledby="noteH">
          <div class="x-dlg-hd"><h2 id="noteH">示意说明</h2><button class="x-dlg-x" id="noteX" type="button" aria-label="关闭">✕</button></div>
          <p id="noteTxt"></p>
          <p class="x-src" id="noteSrc"></p>
        </dialog>
        <dialog class="x-dlg x-rec-dlg" id="recDlg" aria-labelledby="recH">
          <div class="x-dlg-hd"><h2 id="recH">录屏模式</h2><button class="x-dlg-x" id="recX" type="button" aria-label="关闭">✕</button></div>
          <div class="x-rec-f">
            <label for="recY0">起始年</label><select id="recY0"></select>
            <label for="recY1">结束年</label><select id="recY1"></select>
            <label for="recDur">每帧时长</label><select id="recDur"><option value="6">6 秒</option><option value="8" selected>8 秒</option><option value="10">10 秒</option></select>
            <label for="recView">视图</label><select id="recView"><option value="map" selected>地图</option><option value="camp">阵营</option></select>
          </div>
          <p class="x-src">开始后隐藏所有控件，按 Esc 随时退出。</p>
          <button class="x-rec-go" id="recGo" type="button">开始</button>
        </dialog>
      </div>
    </div>
    <script src="vendor/hark.js"></script>
    <script src="data/sandbox_data.js"></script>
    <script src="js/core.js"></script>
    <script src="js/castles.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/econ.js"></script>
    <script src="js/relations.js"></script>
    <script src="js/playback.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/views.js"></script>
  </body>
</html>
