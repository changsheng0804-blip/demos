<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent 跨文件校验器 · V0.4</title>
  <style>
    :root {
      --bg:#080d17;--panel:#0d1525;--panel2:#111d30;--line:#1e2e47;--line2:#2a4060;
      --text:#c8d8f0;--muted:#5a7799;--cyan:#38d5ff;--green:#4eff9e;
      --yellow:#ffe066;--red:#ff6b6b;--orange:#ff9a3c;
      --mono:'JetBrains Mono',Consolas,monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;min-height:100vh;}

    header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px;background:rgba(8,13,23,.95);position:sticky;top:0;z-index:10;}
    header h1{font-size:15px;color:var(--cyan);font-weight:700;}
    header span{color:var(--muted);font-size:11px;}
    .v-badge{background:rgba(56,213,255,.12);border:1px solid rgba(56,213,255,.3);color:var(--cyan);border-radius:3px;padding:2px 7px;font-size:10px;font-weight:700;}

    .layout{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 49px);}

    .pane{display:flex;flex-direction:column;}
    .pane-hd{padding:10px 16px;border-bottom:1px solid var(--line);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;}
    .pane:first-child{border-right:1px solid var(--line);}

    /* 状态点 */
    .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background .3s;flex-shrink:0;}
    .dot.running{background:var(--yellow);animation:pulse 1s infinite;}
    .dot.ok{background:var(--green);}
    .dot.err{background:var(--red);}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

    /* 日志 */
    #logList{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:7px;}
    .log{border-left:3px solid var(--line2);padding:8px 12px;background:var(--panel);border-radius:0 4px 4px 0;opacity:0;transform:translateX(-8px);transition:opacity .3s,transform .3s;}
    .log.show{opacity:1;transform:translateX(0);}
    .log.read{border-left-color:var(--cyan);}
    .log.walk{border-left-color:var(--yellow);}
    .log.compare{border-left-color:var(--orange);}
    .log.conflict{border-left-color:var(--red);}
    .log.success{border-left-color:var(--green);}
    .log-step{font-size:10px;color:var(--muted);margin-bottom:3px;}
    .log-title{font-weight:700;margin-bottom:4px;font-size:12px;}
    .log-body{color:#9dbce0;line-height:1.6;font-size:11px;}
    .log-code{margin-top:6px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px 8px;font-size:10px;color:#7ab0d8;white-space:pre-wrap;word-break:break-all;}

    /* 结果 */
    #resultArea{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
    .card{border:1px solid var(--line);border-radius:5px;background:var(--panel);overflow:hidden;}
    .card-hd{padding:9px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;}
    .card-body{padding:12px 14px;font-size:12px;line-height:1.7;}
    .tag{border-radius:3px;padding:2px 7px;font-size:10px;font-weight:700;}
    .tag-info{background:rgba(56,213,255,.1);border:1px solid rgba(56,213,255,.25);color:var(--cyan);}
    .tag-ok{background:rgba(78,255,158,.1);border:1px solid rgba(78,255,158,.25);color:var(--green);}
    .tag-warn{background:rgba(255,154,60,.1);border:1px solid rgba(255,154,60,.25);color:var(--orange);}
    .tag-err{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);color:var(--red);}

    .field{display:flex;gap:8px;margin:3px 0;align-items:baseline;font-size:12px;}
    .fk{color:var(--muted);min-width:120px;font-size:11px;}
    .fv{color:var(--text);}
    .fv.ok{color:var(--green);font-weight:600;}
    .fv.bad{color:var(--red);font-weight:600;}
    .fv.miss{color:var(--orange);font-style:italic;}

    .compare-row{display:flex;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center;font-size:11px;}
    .compare-row:last-child{border-bottom:none;}
    .cr-field{min-width:70px;color:var(--muted);}
    .cr-f1,.cr-f2{flex:1;padding:3px 7px;border-radius:3px;}
    .cr-f1.ok,.cr-f2.ok{background:rgba(78,255,158,.08);color:var(--green);}
    .cr-f1.bad,.cr-f2.bad{background:rgba(255,107,107,.08);color:var(--red);}
    .cr-f1.miss,.cr-f2.miss{background:rgba(255,154,60,.08);color:var(--orange);font-style:italic;}

    .conclusion{border:1px solid var(--line);border-radius:5px;padding:16px;background:var(--panel2);font-size:12px;line-height:1.8;}
    .conclusion.conflict{border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.04);}
    .conclusion.pass{border-color:rgba(78,255,158,.3);background:rgba(78,255,158,.04);}

    /* 控制栏 */
    .controls{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;}
    button{font-family:var(--mono);font-size:12px;font-weight:700;border-radius:4px;padding:8px 16px;cursor:pointer;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);transition:all .15s;}
    button:hover{border-color:var(--cyan);color:var(--cyan);}
    button.primary{border-color:rgba(56,213,255,.4);background:rgba(56,213,255,.1);color:var(--cyan);}
    button:disabled{opacity:.4;cursor:not-allowed;}

    /* fetch 状态 */
    .fetch-status{font-size:11px;color:var(--muted);margin-top:4px;}
    .fetch-status.ok{color:var(--green);}
    .fetch-status.err{color:var(--red);}

    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px;}

    @media(max-width:700px){.layout{grid-template-columns:1fr;}}
  </style>
</head>
<body>

<header>
  <h1>Agent 跨文件校验器</h1>
  <span class="v-badge">V0.4</span>
  <span>真实 fetch · 两个独立 HTML 文件 · 结构化跨文件引用校验</span>
</header>

<div class="layout">

  <!-- 左：执行日志 -->
  <div class="pane">
    <div class="pane-hd">
      <div class="dot" id="dot"></div>
      执行日志
      <span id="statusLabel" style="color:var(--muted);font-weight:400;">待启动</span>
    </div>
    <div id="logList">
      <div style="color:var(--muted);font-size:11px;padding:4px;">点击「开始校验」后，这里会实时显示读取和校验过程。</div>
    </div>
    <div class="controls">
      <button class="primary" id="runBtn" onclick="run()">▶ 开始跨文件校验</button>
      <button onclick="reset()">重置</button>
    </div>
  </div>

  <!-- 右：校验结果 -->
  <div class="pane">
    <div class="pane-hd">校验结果</div>
    <div id="resultArea">
      <div style="color:var(--muted);font-size:11px;padding:4px;">等待校验完成。</div>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════
//  配置：两个文件的真实 URL
//  部署到 GitHub Pages 后自动使用正确的 base URL
// ═══════════════════════════════════════════════
const BASE = (() => {
  const loc = window.location.href;
  return loc.substring(0, loc.lastIndexOf('/') + 1);
})();

const FILE1_URL = BASE + 'diagram-ticket-flow.html';
const FILE2_URL = BASE + 'policy-review-rules.html';

// ═══════════════════════════════════════════════
//  工具函数
// ═══════════════════════════════════════════════
const delay = ms => new Promise(r => setTimeout(r, ms));

function parseLayer(html, id) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const el = doc.getElementById(id);
  if (!el) return null;
  try { return JSON.parse(el.textContent); } catch { return null; }
}

function setStatus(state, label) {
  document.getElementById('dot').className = 'dot ' + state;
  document.getElementById('statusLabel').textContent = label;
  document.getElementById('statusLabel').style.color =
    state === 'ok' ? 'var(--green)' : state === 'err' ? 'var(--red)' : 'var(--yellow)';
}

function addLog(type, step, title, body, code) {
  const list = document.getElementById('logList');
  const el = document.createElement('div');
  el.className = 'log ' + type;
  el.innerHTML =
    `<div class="log-step">${step}</div>` +
    `<div class="log-title">${title}</div>` +
    `<div class="log-body">${body}</div>` +
    (code ? `<div class="log-code">${code}</div>` : '');
  list.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  list.scrollTop = list.scrollHeight;
}

function addResult(html) {
  const area = document.getElementById('resultArea');
  if (area.querySelector('[data-ph]')) area.innerHTML = '';
  area.insertAdjacentHTML('beforeend', html);
  area.scrollTop = area.scrollHeight;
}

// ═══════════════════════════════════════════════
//  主校验流程
// ═══════════════════════════════════════════════
let running = false;

async function run() {
  if (running) return;
  running = true;
  document.getElementById('runBtn').disabled = true;
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('logList').innerHTML = '';
  setStatus('running', '运行中');

  // ── STEP 1: fetch 文件一 ──
  await delay(300);
  addLog('read', 'STEP 1 · fetch', '真实请求文件一',
    `fetch("${FILE1_URL}")`,
    `GET ${FILE1_URL}`
  );

  let html1, manifest1, state1, crossrefs1;
  try {
    const res = await fetch(FILE1_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    html1 = await res.text();
    manifest1  = parseLayer(html1, 'agent-media-manifest');
    state1     = parseLayer(html1, 'agent-media-state');
    crossrefs1 = parseLayer(html1, 'agent-media-crossrefs');

    addLog('read', 'STEP 1 · 解析', '解析 agent-media-* 层',
      `成功读取 ${html1.length.toLocaleString()} 字节，提取结构层。`,
      `manifest.assetId: "${manifest1?.assetId}"\n` +
      `state.nodes: ${state1?.nodes?.length} 个\n` +
      `crossrefs.refs: ${crossrefs1?.refs?.length} 条`
    );

    addResult(`
      <div class="card">
        <div class="card-hd"><span class="tag tag-info">文件一</span>${manifest1?.title || '—'}</div>
        <div class="card-body">
          <div class="field"><span class="fk">fetch URL</span><span class="fv" style="word-break:break-all;font-size:10px;">${FILE1_URL}</span></div>
          <div class="field"><span class="fk">assetId</span><span class="fv">${manifest1?.assetId}</span></div>
          <div class="field"><span class="fk">节点数</span><span class="fv">${state1?.nodes?.length}</span></div>
          <div class="field"><span class="fk">fetch 状态</span><span class="fv ok">✓ 200 OK · 真实读取</span></div>
        </div>
      </div>`);

  } catch (err) {
    addLog('conflict', 'STEP 1 · 错误', 'fetch 失败', err.message);
    addResult(`<div class="conclusion conflict"><span style="color:var(--red)">✗ 无法读取文件一：${err.message}</span><br><br>请确认文件已上传到 GitHub Pages，且 URL 正确。</div>`);
    setStatus('err', '读取失败');
    running = false;
    document.getElementById('runBtn').disabled = false;
    return;
  }

  // ── STEP 2: 发现 crossRef ──
  await delay(500);
  const ref = crossrefs1?.refs?.[0];
  if (!ref) {
    addLog('conflict', 'STEP 2', '未找到跨文件引用', '文件一的 agent-media-crossrefs 中没有 refs。');
    setStatus('err', '无引用');
    running = false;
    document.getElementById('runBtn').disabled = false;
    return;
  }

  const localNode = state1.nodes.find(n => n.id === ref.localNode);

  addLog('walk', 'STEP 2 · 发现引用', `节点 ${ref.localNode} 声明了跨文件连接`,
    `关系类型：${ref.relationType}　目标文件：${ref.target.file}`,
    `refId:        "${ref.refId}"\nlocalNode:    "${ref.localNode}"\nrelationType: "${ref.relationType}"\ntargetFile:   "${ref.target.file}"\ntargetNode:   "${ref.target.node}"\ndeclaredBy:   "${ref.declaredBy}"\nverifiedBy:   "${ref.verifiedBy}"\nverifiedAt:   "${ref.verifiedAt}"`
  );

  addResult(`
    <div class="card">
      <div class="card-hd"><span class="tag tag-info">跨文件引用</span>${ref.refId} · ${ref.relationType}</div>
      <div class="card-body">
        <div class="field"><span class="fk">本文件节点</span><span class="fv">${ref.localNode}</span></div>
        <div class="field"><span class="fk">目标文件</span><span class="fv">${ref.target.file}</span></div>
        <div class="field"><span class="fk">目标节点</span><span class="fv">${ref.target.node}</span></div>
        <div class="field"><span class="fk">声明者</span><span class="fv">${ref.declaredBy}</span></div>
        <div class="field"><span class="fk">验证者</span><span class="fv">${ref.verifiedBy} · ${ref.verifiedAt}</span></div>
        <div class="field"><span class="fk">引用格式</span><span class="fv ok">✓ 有效</span></div>
      </div>
    </div>`);

  // ── STEP 3: fetch 文件二 ──
  await delay(600);
  const FILE2_RESOLVED = BASE + ref.target.file;

  addLog('read', 'STEP 3 · fetch', '沿引用真实请求文件二',
    `fetch("${FILE2_RESOLVED}")`,
    `GET ${FILE2_RESOLVED}`
  );

  let html2, state2;
  try {
    const res2 = await fetch(FILE2_RESOLVED);
    if (!res2.ok) throw new Error(`HTTP ${res2.status}`);
    html2  = await res2.text();
    const manifest2 = parseLayer(html2, 'agent-media-manifest');
    state2 = parseLayer(html2, 'agent-media-state');

    const targetNode = state2?.nodes?.find(n => n.id === ref.target.node);

    addLog('read', 'STEP 3 · 解析', '提取目标节点',
      `成功读取 ${html2.length.toLocaleString()} 字节，定位节点 "${ref.target.node}"。`,
      `manifest.assetId: "${manifest2?.assetId}"\n` +
      `targetNode.id:    "${targetNode?.id}"\n` +
      `conditions:       ${targetNode?.triggerConditions?.length} 个\n` +
      `conditionLogic:   "${targetNode?.conditionLogic}"`
    );

    addResult(`
      <div class="card">
        <div class="card-hd"><span class="tag tag-info">文件二</span>${manifest2?.title || '—'}</div>
        <div class="card-body">
          <div class="field"><span class="fk">fetch URL</span><span class="fv" style="word-break:break-all;font-size:10px;">${FILE2_RESOLVED}</span></div>
          <div class="field"><span class="fk">assetId</span><span class="fv">${manifest2?.assetId}</span></div>
          <div class="field"><span class="fk">目标节点</span><span class="fv">${targetNode?.id}</span></div>
          <div class="field"><span class="fk">条件数量</span><span class="fv">${targetNode?.triggerConditions?.length}（逻辑：${targetNode?.conditionLogic}）</span></div>
          <div class="field"><span class="fk">fetch 状态</span><span class="fv ok">✓ 200 OK · 真实读取</span></div>
        </div>
      </div>`);

    // ── STEP 4: 对比条件 ──
    await delay(700);

    const c1 = localNode?.triggerConditions || [];
    const c2 = targetNode?.triggerConditions || [];

    addLog('compare', 'STEP 4 · 对比', '逐字段比对 triggerConditions',
      `文件一：${c1.length} 个条件　文件二：${c2.length} 个条件（逻辑：${targetNode?.conditionLogic}）`,
      'contractFields: ' + JSON.stringify(ref.contractFields)
    );

    // 收集所有字段
    const allFields = [...new Set([...c1.map(c => c.field), ...c2.map(c => c.field)])];
    const conflicts = [];
    const matches   = [];

    allFields.forEach(field => {
      const f1 = c1.find(c => c.field === field);
      const f2 = c2.find(c => c.field === field);
      const same = f1 && f2 && f1.op === f2.op && String(f1.value) === String(f2.value);
      if (same) matches.push(field);
      else conflicts.push({ field, f1, f2 });
    });

    // 对比表格
    const rows = allFields.map(field => {
      const f1 = c1.find(c => c.field === field);
      const f2 = c2.find(c => c.field === field);
      const same = f1 && f2 && f1.op === f2.op && String(f1.value) === String(f2.value);
      const v1 = f1 ? `${f1.op} ${f1.value}` : '—（缺失）';
      const v2 = f2 ? `${f2.op} ${f2.value}` : '—（缺失）';
      const cls1 = !f1 ? 'miss' : same ? 'ok' : 'bad';
      const cls2 = !f2 ? 'miss' : same ? 'ok' : 'bad';
      const tag = same
        ? `<span class="tag tag-ok" style="font-size:9px;">一致</span>`
        : `<span class="tag tag-err" style="font-size:9px;">矛盾</span>`;
      return `
        <div class="compare-row">
          <span class="cr-field">${field}</span>
          <span class="cr-f1 ${cls1}">文件一: ${v1}</span>
          <span class="cr-f2 ${cls2}">文件二: ${v2}</span>
          ${tag}
        </div>`;
    }).join('');

    addResult(`
      <div class="card">
        <div class="card-hd"><span class="tag ${conflicts.length ? 'tag-err' : 'tag-ok'}">条件对比</span>triggerConditions 逐字段校验</div>
        <div class="card-body">${rows}</div>
      </div>`);

    // ── STEP 5: 结论 ──
    await delay(500);

    if (conflicts.length > 0) {
      const missing = conflicts.filter(c => !c.f1);
      addLog('conflict', 'STEP 5 · 结论', `发现 ${conflicts.length} 处矛盾`,
        `文件一缺少 ${missing.length} 个文件二要求的条件字段。`,
        missing.map(c => `文件一缺少: { field: "${c.field}", op: "${c.f2.op}", value: ${JSON.stringify(c.f2.value)} }`).join('\n')
      );

      addResult(`
        <div class="conclusion conflict">
          <div style="color:var(--red);font-weight:700;margin-bottom:10px;">⚠ 跨文件校验：发现结构矛盾</div>
          <div style="margin-bottom:12px;">
            文件一（工单流程图）将所有 <code>riskLevel === high</code> 的工单路由到 <code>manual-review</code>，
            但文件二（审核规则）要求同时满足 <code>riskLevel === high AND amount &gt; 10000</code> 才触发人工审核。
          </div>
          <div style="color:var(--orange);margin-bottom:12px;">
            执行缺口：当工单 riskLevel 为 high 但 amount ≤ 10000 时，文件一将其发往人工审核节点，但文件二的规则不会处理它。<br>
            <strong>这批工单进入系统后无人接收。</strong>
          </div>
          <div style="color:var(--muted);font-size:10px;line-height:1.8;">
            引用路径：${ref.refId} · ${ref.declaredBy} 声明 · ${ref.verifiedBy} 验证 · ${ref.verifiedAt}<br>
            contractFields: ${ref.contractFields.map(f => `"${f}"`).join(', ')}<br>
            校验结果：riskLevel ✓ 一致 · amount ✗ 文件一缺失此条件<br>
            <span style="color:var(--green);">★ 以上结论来自真实 fetch 两个独立 HTML 文件后解析得出，非模拟数据。</span>
          </div>
        </div>`);

      setStatus('err', '发现矛盾');

    } else {
      addLog('success', 'STEP 5 · 结论', '校验通过', '两个文件的触发条件完全一致，跨文件引用合约成立。');
      addResult(`<div class="conclusion pass"><span style="color:var(--green);font-weight:700;">✓ 跨文件校验通过，无矛盾。</span></div>`);
      setStatus('ok', '校验通过');
    }

  } catch (err) {
    addLog('conflict', 'STEP 3 · 错误', 'fetch 文件二失败', err.message);
    addResult(`<div class="conclusion conflict"><span style="color:var(--red)">✗ 无法读取文件二：${err.message}</span></div>`);
    setStatus('err', '读取失败');
  }

  running = false;
  document.getElementById('runBtn').disabled = false;
}

function reset() {
  document.getElementById('logList').innerHTML = '<div style="color:var(--muted);font-size:11px;padding:4px;">点击「开始校验」后，这里会实时显示读取和校验过程。</div>';
  document.getElementById('resultArea').innerHTML = '<div style="color:var(--muted);font-size:11px;padding:4px;" data-ph>等待校验完成。</div>';
  document.getElementById('dot').className = 'dot';
  document.getElementById('statusLabel').textContent = '待启动';
  document.getElementById('statusLabel').style.color = 'var(--muted)';
  document.getElementById('runBtn').disabled = false;
  running = false;
}
</script>

</body>
</html>
